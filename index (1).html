<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050d09">
<title>Diagnóstico Contábil Pet | Contabilidade.Vet</title>
<meta name="description" content="Responda 7 perguntas e descubra se vale migrar para uma contabilidade especializada em clínicas veterinárias e petshops.">
<link rel="icon" href="https://contabilidade.vet/wp-content/uploads/2024/01/cropped-fav-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050d09; --bg2:#0a1a12;
  --green:#10FF5A; --green-d:#40836A;
  --mag:#CC3366;
  --txt:#ffffff; --mut:#9fb5a8; --line:rgba(255,255,255,.12);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--txt);background:var(--bg);min-height:100vh;min-height:100dvh;
  background-image:
    radial-gradient(900px 500px at 85% -10%,rgba(16,255,90,.16),transparent 60%),
    radial-gradient(700px 500px at -10% 110%,rgba(204,51,102,.18),transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.sora{font-family:'Sora','Inter',system-ui,sans-serif}
.wrap{
  max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
}
header{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 18px}
.logo{height:40px;width:auto;display:block}
.logo-fallback{font-family:'Sora',sans-serif;font-weight:800;font-size:22px;color:var(--green);letter-spacing:-.02em}
.progress{width:100%;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;visibility:hidden}
.progress.on{visibility:visible}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--green-d),var(--green));transition:width .4s ease}
main{flex:1;display:flex;flex-direction:column;justify-content:center}
.card{
  background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:24px;
  padding:26px 20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:in .35s ease both;
}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--green);background:rgba(16,255,90,.1);border:1px solid rgba(16,255,90,.3);padding:7px 12px;border-radius:99px;margin-bottom:18px
}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
h1{font-size:clamp(28px,8vw,40px);line-height:1.1;font-weight:800;letter-spacing:-.025em;margin-bottom:14px}
h2{font-size:clamp(22px,6vw,28px);line-height:1.2;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
mark{background:none;color:var(--green)}
.sub{color:var(--mut);font-size:16px;line-height:1.55;margin-bottom:22px}
.hint{color:var(--mut);font-size:14px;margin-bottom:18px}
.qnum{font-size:13px;font-weight:600;color:var(--green);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  font:500 16px/1.35 'Inter',sans-serif;color:var(--txt);
  padding:15px 16px;min-height:58px;border-radius:var(--r);
  background:rgba(255,255,255,.04);border:1.5px solid var(--line);
  transition:border-color .15s,background .15s,transform .1s;-webkit-tap-highlight-color:transparent;
}
.opt .k{
  flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font:700 13px 'Sora',sans-serif;color:var(--green);background:rgba(16,255,90,.1);border:1px solid rgba(16,255,90,.25);
  transition:all .15s
}
.opt:hover{border-color:rgba(16,255,90,.55);background:rgba(16,255,90,.06)}
.opt:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--green);background:rgba(16,255,90,.14)}
.opt.sel .k{background:var(--green);color:#04130a}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;cursor:pointer;border:0;text-decoration:none;
  font:700 16px 'Sora',sans-serif;letter-spacing:.01em;color:#04130a;background:var(--green);
  padding:18px 24px;border-radius:99px;box-shadow:0 8px 30px rgba(16,255,90,.28);
  transition:transform .12s,box-shadow .2s,filter .2s;-webkit-tap-highlight-color:transparent
}
.btn:hover{filter:brightness(1.07);box-shadow:0 10px 38px rgba(16,255,90,.4)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn svg{width:22px;height:22px;flex:none}
.back{
  margin-top:16px;background:none;border:0;color:var(--mut);font:500 14px 'Inter',sans-serif;cursor:pointer;
  padding:10px 4px;display:inline-flex;align-items:center;gap:6px
}
.back:hover{color:#fff}
.trust{list-style:none;display:grid;gap:10px;margin:0 0 24px}
.trust li{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:#dbe8e0;line-height:1.4}
.trust svg{flex:none;width:20px;height:20px;margin-top:1px;color:var(--green)}
.micro{margin-top:14px;font-size:13px;color:var(--mut);text-align:center;line-height:1.4}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 8px}
input{
  width:100%;font:500 16px 'Inter',sans-serif;color:#fff;padding:16px;border-radius:var(--r);
  background:rgba(255,255,255,.06);border:1.5px solid var(--line);outline:none;transition:border-color .15s
}
input::placeholder{color:#6f8579}
input:focus{border-color:var(--green)}
input.err{border-color:var(--mag)}
.errmsg{color:#ff7aa3;font-size:13px;margin-top:6px;display:none}
.errmsg.on{display:block}
form .btn{margin-top:22px}
.check{
  width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin-bottom:18px;
  background:rgba(16,255,90,.14);border:2px solid var(--green);color:var(--green);box-shadow:0 0 30px rgba(16,255,90,.3)
}
.check svg{width:34px;height:34px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#e6f1ea}
.chip.pain{border-color:rgba(204,51,102,.55);background:rgba(204,51,102,.16);color:#ff9dba}
.chip.prio{border-color:rgba(16,255,90,.45);background:rgba(16,255,90,.12);color:var(--green)}
.insight{
  border-left:3px solid var(--mag);padding:12px 14px;margin:0 0 20px;border-radius:0 12px 12px 0;
  background:rgba(204,51,102,.1);font-size:15px;line-height:1.55;color:#f3dfe6
}
.bar{height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:16px 0 0}
.bar i{display:block;height:100%;width:0;background:var(--green);animation:fill 2.8s linear forwards}
@keyframes fill{to{width:100%}}
footer{text-align:center;color:#6f8579;font-size:12px;padding-top:20px}
@media(min-width:600px){.card{padding:36px 34px}.logo{height:46px}.wrap{padding-top:32px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

function score(){
  var t = 0;
  Q.forEach(function(q){ if(state.a[q.k]) t += state.a[q.k][1]; });
  return t;
}
function priority(t){ return t >= 11 ? 'Alta' : (t >= 7 ? 'Média' : 'Baixa'); }
function prioEmoji(p){ return p === 'Alta' ? '🔥' : (p === 'Média' ? '🟡' : '🔵'); }

function buildMessage(){
  var t = score(), p = priority(t), a = function(k){ return state.a[k][0]; };

  } catch(e){}
  return 'Olá! Fiz o diagnóstico no site da Contabilidade.Vet e quero conversar sobre migrar a contabilidade do meu negócio.\n\n' +
    '👤 Nome: ' + state.nome + '\n' +

}

}

  track();
  progress.classList.add('on'); setProgress(TOTAL);

  var dorIdx = state.idx.dor;
  var chips =
    '<span class="chip">'+esc(state.a.negocio[0])+'</span>'+
    '<span class="chip pain">'+esc(Q[2].o[dorIdx][0])+'</span>'+
    '<span class="chip prio">Prioridade '+p.toLowerCase()+'</span>';

  app.innerHTML =
   '<section class="card">'+
   '<div class="check">'+ICON_CHECK+'</div>'+
   '<h2>'+esc(state.nome.split(' ')[0])+', encontramos o ponto crítico</h2>'+
   '<p class="sub" style="margin-bottom:16px">Este é o resumo das suas respostas:</p>'+
   '<div class="chips">'+chips+'</div>'+
   '<div class="insight">'+esc(INSIGHTS[dorIdx])+'</div>'+
   '<a class="btn" id="go" href="'+url+'" target="_blank" rel="noopener">'+ICON_WA+'<span>Falar com o especialista no WhatsApp</span></a>'+
   (inFrame ? '' : '<div class="bar"><i></i></div><p class="micro" id="redir">Abrindo o WhatsApp automaticamente…</p>')+
   '</section>';

  if(inFrame){
    // dentro de um iframe (pré-visualização) o redirecionamento direto é bloqueado: abre em nova aba
    try { window.open(url,'_blank','noopener'); } catch(e){}
  } else {
    setTimeout(function(){ window.location.href = url; }, 2800);
  }
}

/* ============ NAVEGAÇÃO ============ */
function go(n){
  state.i = n;
  if(n < 0) renderIntro();
  else if(n < Q.length) renderQuestion(n);
  else renderForm();
  window.scrollTo({top:0,behavior:'smooth'});
}

  fbq('init',CONFIG.metaPixelId); fbq('track','PageView');

</script>
